spring:
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    from: ${SPRING_MAIL_FROM:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
  flyway:
    enabled: false
    baseline-on-migrate: true
    validate-on-migrate: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.99.14:3000/aluonbbddpreprod}
    username: ${SPRING_DATASOURCE_USERNAME:aluon}
    password: ${SPRING_DATASOURCE_PASSWORD:aluon}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        tenant_identifier_resolver: com.aluon.core.tenant.service.CurrentTenantIdentifierResolverImpl
  modulith:
    events:
      jdbc-schema-initialization:
        enabled: true

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://192.168.99.14:5174}

integrations:
  jira:
    enabled: ${JIRA_ENABLED:false}
    base-url: ${JIRA_BASE_URL:${JIRA_URL:}}
    username: ${JIRA_USERNAME:}
    api-token: ${JIRA_API_TOKEN:}
    project-key: ${JIRA_PROJECT_KEY:}
    issue-type-name: ${JIRA_ISSUE_TYPE_NAME:Task}
  door-simulation:
    google-street-view:
      enabled: ${DOOR_SIMULATION_ENABLED:false}
      api-key: ${GOOGLE_STREET_VIEW_API_KEY:}
      base-url: ${GOOGLE_STREET_VIEW_BASE_URL:https://maps.googleapis.com}
      default-image-size: ${DOOR_SIMULATION_DEFAULT_IMAGE_SIZE:640x640}
      default-fov: ${DOOR_SIMULATION_DEFAULT_FOV:90}
    stability:
      enabled: ${DOOR_SIMULATION_ENABLED:false}
      api-key: ${STABILITY_API_KEY:}
      base-url: ${STABILITY_BASE_URL:https://api.stability.ai}
      inpaint-path: ${STABILITY_INPAINT_PATH:/v2beta/stable-image/edit/inpaint}
      default-prompt: ${DOOR_SIMULATION_DEFAULT_PROMPT:replace the existing door with a realistic modern door, photorealistic, consistent lighting, same perspective}
      default-negative-prompt: ${DOOR_SIMULATION_DEFAULT_NEGATIVE_PROMPT:}
      output-format: ${STABILITY_OUTPUT_FORMAT:png}
    object-storage:
      enabled: ${DOOR_SIMULATION_ENABLED:false}
      endpoint: ${OBJECT_STORAGE_ENDPOINT:}
      region: ${OBJECT_STORAGE_REGION:us-east-1}
      bucket: ${OBJECT_STORAGE_BUCKET:}
      access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
      secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
      public-base-url: ${OBJECT_STORAGE_PUBLIC_BASE_URL:}
