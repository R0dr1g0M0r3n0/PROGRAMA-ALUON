spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:aluon-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

app:
  tenant:
    default-id: 00000000-0000-0000-0000-000000000000
