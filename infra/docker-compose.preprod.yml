x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aluon-postgres-preprod
    environment:
      POSTGRES_DB: ${DB_NAME:-aluonbbddpreprod}
      POSTGRES_USER: ${DB_USER:-aluon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aluon}
    ports:
      - "${DB_PORT:-3000}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aluon-network
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: docker.io/r0dr1g0m0r3n0/aluon-backend:preprod
    container_name: aluon-backend-preprod
    environment:
      - SPRING_PROFILES_ACTIVE=preprod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME:-aluonbbddpreprod}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-aluon}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-aluon}
      - APP_TENANT_DEFAULT_ID=${APP_TENANT_DEFAULT_ID:-}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SPRING_MAIL_FROM=${SPRING_MAIL_FROM}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}
    ports:
      - "${BACKEND_PORT:-8081}:8080"
    depends_on:
      - postgres
    networks:
      - aluon-network
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: docker.io/r0dr1g0m0r3n0/aluon-frontend:preprod
    container_name: aluon-frontend-preprod
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    networks:
      - aluon-network
    restart: unless-stopped
    logging: *default-logging

networks:
  aluon-network:
    driver: bridge

volumes:
  pgdata:
    external: true
    name: aluon-pgdata-preprod
