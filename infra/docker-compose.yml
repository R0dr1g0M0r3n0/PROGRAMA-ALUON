version: '3.8'

x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aluon-postgres-${ENV_NAME:-local}
    environment:
      POSTGRES_DB: ${DB_NAME:-aluonbbdd}
      POSTGRES_USER: ${DB_USER:-aluon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aluon}
    ports:
      - "${DB_PORT:-3000}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aluon-network
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: aluon-backend-${ENV_NAME:-local}
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-${ENV_NAME:-local}}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/${DB_NAME:-aluonbbdd}}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-${DB_USER:-aluon}}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-${DB_PASSWORD:-aluon}}
      - GOOGLE_STREET_VIEW_API_KEY=${GOOGLE_STREET_VIEW_API_KEY:-}
      - GOOGLE_MAPS_BROWSER_API_KEY=${GOOGLE_MAPS_BROWSER_API_KEY:-}
      - APP_TENANT_DEFAULT_ID=${APP_TENANT_DEFAULT_ID:-}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD:-}
      - SPRING_MAIL_FROM=${SPRING_MAIL_FROM:-}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-}
      - JIRA_ENABLED=${JIRA_ENABLED:-false}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_URL=${JIRA_URL:-}
      - JIRA_USERNAME=${JIRA_USERNAME:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_PROJECT_KEY=${JIRA_PROJECT_KEY:-}
      - JIRA_ISSUE_TYPE_NAME=${JIRA_ISSUE_TYPE_NAME:-Task}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      - postgres
    networks:
      - aluon-network
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: aluon-frontend-${ENV_NAME:-local}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - aluon-network
    restart: unless-stopped
    logging: *default-logging

networks:
  aluon-network:
    driver: bridge

volumes:
  pgdata:
    name: aluon-pgdata-${ENV_NAME:-local}
